server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-seconds: 3600
  initial-admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:https://pharmasoft.upeu.edu.pe}
